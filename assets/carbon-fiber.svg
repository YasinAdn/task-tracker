<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <!-- Warp bundle: glossy 45-degree diagonal fiber sheen -->
    <linearGradient id="warpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="25%" stop-color="#262626"/>
      <stop offset="50%" stop-color="#4a4a4a"/>
      <stop offset="75%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>

    <!-- Weft bundle: dark cross-grain fiber sheen -->
    <linearGradient id="weftGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="30%" stop-color="#181818"/>
      <stop offset="55%" stop-color="#2c2c2c"/>
      <stop offset="80%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>

    <!-- Micro-fiber texture lines for 3D realism -->
    <pattern id="warpLines" width="2" height="2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="2" stroke="#ffffff" stroke-opacity="0.12" stroke-width="0.5"/>
      <line x1="1" y1="0" x2="1" y2="2" stroke="#000000" stroke-opacity="0.45" stroke-width="0.5"/>
    </pattern>

    <pattern id="weftLines" width="2" height="2" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="2" y2="0" stroke="#ffffff" stroke-opacity="0.08" stroke-width="0.5"/>
      <line x1="0" y1="1" x2="2" y2="1" stroke="#000000" stroke-opacity="0.5" stroke-width="0.5"/>
    </pattern>

    <g id="warpCell">
      <rect width="8" height="8" rx="0.75" fill="url(#warpGrad)"/>
      <rect width="8" height="8" rx="0.75" fill="url(#warpLines)"/>
      <rect x="0.5" y="0.5" width="7" height="7" rx="0.5" fill="none" stroke="#000000" stroke-width="0.6" stroke-opacity="0.7"/>
    </g>

    <g id="weftCell">
      <rect width="8" height="8" rx="0.75" fill="url(#weftGrad)"/>
      <rect width="8" height="8" rx="0.75" fill="url(#weftLines)"/>
      <rect x="0.5" y="0.5" width="7" height="7" rx="0.5" fill="none" stroke="#000000" stroke-width="0.6" stroke-opacity="0.85"/>
    </g>
  </defs>

  <!-- Deep carbon base #262626 / #0d0d0d -->
  <rect width="32" height="32" fill="#0d0d0d"/>

  <!-- Row 0: Warp, Warp, Weft, Weft -->
  <use href="#warpCell" x="0" y="0"/>
  <use href="#warpCell" x="8" y="0"/>
  <use href="#weftCell" x="16" y="0"/>
  <use href="#weftCell" x="24" y="0"/>

  <!-- Row 1: Weft, Warp, Warp, Weft (Shifted right by 1 -> 45-degree twill) -->
  <use href="#weftCell" x="0" y="8"/>
  <use href="#warpCell" x="8" y="8"/>
  <use href="#warpCell" x="16" y="8"/>
  <use href="#weftCell" x="24" y="8"/>

  <!-- Row 2: Weft, Weft, Warp, Warp -->
  <use href="#weftCell" x="0" y="16"/>
  <use href="#weftCell" x="8" y="16"/>
  <use href="#warpCell" x="16" y="16"/>
  <use href="#warpCell" x="24" y="16"/>

  <!-- Row 3: Warp, Weft, Weft, Warp -->
  <use href="#warpCell" x="0" y="24"/>
  <use href="#weftCell" x="8" y="24"/>
  <use href="#weftCell" x="16" y="24"/>
  <use href="#warpCell" x="24" y="24"/>
</svg>