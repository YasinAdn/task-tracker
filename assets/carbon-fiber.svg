<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <defs>
    <!-- Horizontal carbon tow: vivid glossy cylindrical graphite dome -->
    <linearGradient id="horizDome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050608"/>
      <stop offset="18%" stop-color="#22262e"/>
      <stop offset="38%" stop-color="#687182"/>
      <stop offset="56%" stop-color="#454c59"/>
      <stop offset="82%" stop-color="#171a20"/>
      <stop offset="100%" stop-color="#040507"/>
    </linearGradient>

    <!-- Vertical carbon tow: darker contrasting cross-grain dome -->
    <linearGradient id="vertDome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#040507"/>
      <stop offset="18%" stop-color="#15181e"/>
      <stop offset="40%" stop-color="#434a57"/>
      <stop offset="60%" stop-color="#2a2f38"/>
      <stop offset="84%" stop-color="#111318"/>
      <stop offset="100%" stop-color="#030406"/>
    </linearGradient>

    <!-- Crisp tuck shadows where bundles pass under adjacent perpendicular tows -->
    <linearGradient id="tuckLR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.78"/>
      <stop offset="28%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="72%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.78"/>
    </linearGradient>

    <linearGradient id="tuckTB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.82"/>
      <stop offset="28%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="72%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.82"/>
    </linearGradient>

    <!-- Integer-aligned 6x6 cells (6px * 4 = 24px 1:1 with CSS) -->
    <g id="hTow">
      <rect x="0" y="0" width="6" height="6" fill="url(#horizDome)"/>
      <rect x="0" y="0" width="6" height="6" fill="url(#tuckLR)"/>
      <!-- Crisp integer 1px filament glint & shadow trench -->
      <rect x="1" y="2" width="4" height="1" fill="#ffffff" fill-opacity="0.22"/>
      <rect x="0" y="5" width="6" height="1" fill="#000000" fill-opacity="0.75"/>
    </g>

    <g id="vTow">
      <rect x="0" y="0" width="6" height="6" fill="url(#vertDome)"/>
      <rect x="0" y="0" width="6" height="6" fill="url(#tuckTB)"/>
      <!-- Crisp integer 1px filament glint & shadow trench -->
      <rect x="2" y="1" width="1" height="4" fill="#ffffff" fill-opacity="0.14"/>
      <rect x="5" y="0" width="1" height="6" fill="#000000" fill-opacity="0.8"/>
    </g>
  </defs>

  <!-- Deep inter-tow base -->
  <rect width="24" height="24" fill="#030406"/>

  <!-- 2x2 Twill Weave Matrix (4x4 grid of 6x6px tows = 24x24px) -->
  <!-- Row 0: H, H, V, V -->
  <use href="#hTow" x="0" y="0"/>
  <use href="#hTow" x="6" y="0"/>
  <use href="#vTow" x="12" y="0"/>
  <use href="#vTow" x="18" y="0"/>

  <!-- Row 1: V, H, H, V -->
  <use href="#vTow" x="0" y="6"/>
  <use href="#hTow" x="6" y="6"/>
  <use href="#hTow" x="12" y="6"/>
  <use href="#vTow" x="18" y="6"/>

  <!-- Row 2: V, V, H, H -->
  <use href="#vTow" x="0" y="12"/>
  <use href="#vTow" x="6" y="12"/>
  <use href="#hTow" x="12" y="12"/>
  <use href="#hTow" x="18" y="12"/>

  <!-- Row 3: H, V, V, H -->
  <use href="#hTow" x="0" y="18"/>
  <use href="#vTow" x="6" y="18"/>
  <use href="#vTow" x="12" y="18"/>
  <use href="#hTow" x="18" y="18"/>
</svg>
